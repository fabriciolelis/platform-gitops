# Applies the migrations before every sync, so new API pods never start on an
# older schema (ADR-007). If it fails, the sync stops and the running version
# keeps serving. It always runs the same image as the API (overlay `images:`).
apiVersion: batch/v1
kind: Job
metadata:
  name: formula-insights-migrate
  labels:
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/fabriciolelis/formula-insights-api  # tag set by the overlay
          command: ["alembic", "upgrade", "does-not-exist"]  # ROLLBACK DRILL: fails on purpose
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: formula-insights-database
                  key: DATABASE_URL
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

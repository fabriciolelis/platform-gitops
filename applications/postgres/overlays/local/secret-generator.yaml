# Decrypts secret.enc.yaml while Argo CD renders this overlay (KSOPS, ADR-008).
# The Secret holds POSTGRES_PASSWORD and the matching DATABASE_URL, for the
# database and the application.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: formula-insights-database
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secret.enc.yaml

# The API, its migration hook, and the daily importer, in sync wave 1: after the
# database (wave 0) is Healthy (SPEC.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: formula-insights
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: formula-insights
spec:
  project: formula-insights
  source:
    repoURL: https://github.com/fabriciolelis/platform-gitops.git
    targetRevision: main
    path: applications/formula-insights/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: formula-insights
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m

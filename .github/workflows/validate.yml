name: Validate desired state

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned versions (SPEC.md, Implementation decisions); kustomize matches
      # the version built into the pinned Argo CD. Checksums are the upstream ones.
      - name: Install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz -C bin kustomize
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz -C bin kubeconform
          curl -fsSLo bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  bin/yq" | sha256sum -c -
          chmod +x bin/yq
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Test the validation rules
        run: scripts/test-validate.sh

      - name: Validate desired state
        run: scripts/validate.sh
